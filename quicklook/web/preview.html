<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <title>Lottie Preview</title>
    <style>
      /* Quick Look panels follow the system appearance, so the preview does too. */
      :root { color-scheme: light dark; }

      html, body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        font: 12px -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
      }

      body {
        display: flex;
        flex-direction: column;
        background: #f5f5f7;
        color: #1d1d1f;
      }

      @media (prefers-color-scheme: dark) {
        body { background: #1c1c1e; color: #f5f5f7; }
      }

      /* A checkerboard reads transparency honestly, which matters for Lottie. */
      #stage-wrap {
        flex: 1;
        min-height: 0;
        background-color: #ffffff;
        background-image:
          linear-gradient(45deg, #e8e8ed 25%, transparent 25%),
          linear-gradient(-45deg, #e8e8ed 25%, transparent 25%),
          linear-gradient(45deg, transparent 75%, #e8e8ed 75%),
          linear-gradient(-45deg, transparent 75%, #e8e8ed 75%);
        background-size: 20px 20px;
        background-position: 0 0, 0 10px, 10px -10px, -10px 0;
      }

      @media (prefers-color-scheme: dark) {
        #stage-wrap {
          background-color: #111113;
          background-image:
            linear-gradient(45deg, #1f1f23 25%, transparent 25%),
            linear-gradient(-45deg, #1f1f23 25%, transparent 25%),
            linear-gradient(45deg, transparent 75%, #1f1f23 75%),
            linear-gradient(-45deg, transparent 75%, #1f1f23 75%);
        }
      }

      #stage { display: block; width: 100%; height: 100%; }

      /* A Finder icon should carry the animation's own transparency, not a
         checkerboard standing in for it. */
      [data-mode="thumbnail"] body,
      [data-mode="thumbnail"] #stage-wrap {
        background: none;
      }
      [data-mode="thumbnail"] #footer { display: none; }

      #footer {
        flex: none;
        padding: 7px 12px;
        text-align: center;
        font-variant-numeric: tabular-nums;
        opacity: 0.6;
        border-top: 1px solid rgba(128, 128, 128, 0.25);
      }

      #error {
        margin: auto;
        padding: 24px;
        text-align: center;
        opacity: 0.7;
      }
    </style>
  </head>
  <body>
    <div id="stage-wrap"><canvas id="stage"></canvas></div>
    <div id="footer" hidden></div>
    <div id="error" hidden></div>
    <!-- Classic script on purpose: module scripts are blocked at a file:// origin. -->
    <script src="./preview.js"></script>
  </body>
</html>

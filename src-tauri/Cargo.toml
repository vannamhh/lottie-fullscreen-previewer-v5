[package]
name = "lottie-previewer"
version = "1.0.0"
description = "Lottie Fullscreen Previewer"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "lottie_previewer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"

# Windows and Linux spawn a second process when a file is opened while the app
# is running; this forwards that process's argv to the live instance instead.
[target.'cfg(any(windows, target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
